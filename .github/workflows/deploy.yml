name: Web

# PR: comprueba que la imagen compila.
# Push a master: la sube al registry (tags <sha corto> y latest) y Watchtower
# la despliega en el servidor en unos minutos.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.sigueadelanteradio.com
      IMAGE: sigue-adelante-radio-frontend
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login al registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          # Se incrustan en el bundle: no son secretos.
          build-args: |
            VITE_API_URL=https://api.sigueadelanteradio.com
            VITE_WS_URL=wss://ws.sigueadelanteradio.com/ws
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
