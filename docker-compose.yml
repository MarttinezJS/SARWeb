services:
  frontend-web:
    container_name: sigue-adelante-radio-frontend
    image: sigue-adelante-radio-frontend:1.0.0
    build:
      context: .
      args:
        VITE_API_URL: $VITE_API_URL
        VITE_WS_URL: $VITE_WS_URL
    restart: on-failure
    # Solo en loopback: el Nginx del host (80/443) la publica.
    ports:
      - "127.0.0.1:5000:80"
    networks:
      - sigue-adelante-radio

networks:
  sigue-adelante-radio:
    external: true
